<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravador Web NFC — RetroNFC.com.br</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
</head>
<body style="padding-top: 40px; padding-bottom: 60px;">

  <div class="container" style="max-width: 760px;">
    
    <a href="index.html" class="btn btn-glass btn-sm" style="margin-bottom: 24px;">
      ← Voltar para RetroNFC.com.br
    </a>

    <div class="simulator-box" style="padding: 40px;">
      
      <div style="text-align: center; margin-bottom: 30px;">
        <div style="font-size: 3rem; margin-bottom: 12px;">📡</div>
        <h1 style="font-size: 2rem; margin-bottom: 10px;">Gravador Web NFC Nativo</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Grave as URLs dos jogos diretamente em tags virgens <strong>NTAG213</strong> ou <strong>NTAG215</strong> pelo navegador do celular, sem precisar baixar nenhum aplicativo externo!
        </p>
      </div>

      <div id="nfc-support-status"></div>

      <!-- Configuração de Gravação -->
      <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 24px; margin-bottom: 24px;">
        <label style="display: block; font-weight: 700; margin-bottom: 8px; color: var(--cyan);">
          1. Selecione o Jogo para Gravar:
        </label>
        
        <select id="select-game-target" style="width: 100%; padding: 12px 16px; background: #070a12; border: 1px solid var(--border-subtle); border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 20px; outline: none;">
          <option value="super_mario">Super Mario World (SNES)</option>
          <option value="top_gear">Top Gear (SNES)</option>
          <option value="donkey_kong">Donkey Kong Country (SNES)</option>
          <option value="zelda_alttp">The Legend of Zelda: A Link to the Past (SNES)</option>
          <option value="street_fighter">Street Fighter II Turbo (SNES)</option>
          <option value="sonic_2">Sonic the Hedgehog 2 (Mega Drive)</option>
          <option value="pokemon_yellow">Pokémon Yellow Special (Game Boy Color)</option>
          <option value="mega_man_x">Mega Man X (SNES)</option>
        </select>

        <label style="display: block; font-weight: 700; margin-bottom: 8px; color: var(--cyan);">
          2. URL Gerada para a Tag:
        </label>
        <input type="text" id="custom-url-preview" value="https://retronfc.com.br/play.html?game=super_mario" readonly style="width: 100%; padding: 12px 16px; background: #04060b; border: 1px dashed var(--border-glow); border-radius: 8px; color: var(--cyan); font-family: monospace; font-size: 0.9rem; margin-bottom: 24px;">

        <div style="display: flex; gap: 14px; flex-wrap: wrap;">
          <button onclick="writeSelectedTag()" class="btn btn-cyan btn-lg" style="flex: 1;">
            ⚡ Gravar Tag NFC Agora
          </button>
          <button onclick="NfcApp.readTag()" class="btn btn-glass btn-lg">
            🔍 Testar/Ler Tag
          </button>
        </div>
      </div>

      <!-- Log Terminal -->
      <div>
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">
          LOG DE COMUNICAÇÃO NFC:
        </label>
        <div id="nfc-log" style="background: #000; border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 0.82rem; color: #34d399; min-height: 120px; max-height: 200px; overflow-y: auto;">
          <div>[Pronto] Sistema aguardando comando de leitura ou gravação...</div>
        </div>
      </div>

    </div>

  </div>

  <script src="assets/js/nfc.js"></script>
  <script>
    const select = document.getElementById('select-game-target');
    const preview = document.getElementById('custom-url-preview');

    select.addEventListener('change', () => {
      const origin = window.location.origin.includes('http') ? window.location.origin : 'https://retronfc.com.br';
      preview.value = `${origin}/play.html?game=${select.value}`;
    });

    function writeSelectedTag() {
      NfcApp.writeTag(select.value);
    }
  </script>
</body>
</html>
